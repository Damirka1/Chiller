# Checks on every push and pull request, plus installers for macOS and Windows as build artifacts.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # search_text and list_files use ripgrep; tests that need it skip without it, so install it everywhere.
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - name: Unit tests
        shell: bash
        run: ./gradlew check --stacktrace
      # The offline smoke runs real Python checks; it needs python3, which Windows runners do not provide by that name.
      - name: Offline smoke
        if: runner.os != 'Windows'
        run: ./gradlew :evals:offlineSmoke
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
          retention-days: 7

  package:
    name: Installer · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            jdk: temurin
            output: app-desktop/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            # The JetBrains Runtime draws the custom title bar; the installer bundles the JDK it is built with.
            jdk: jetbrains
            output: app-desktop/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # JetBrains Runtime is pinned and downloaded directly: setup-java's jetbrains lookup goes through the GitHub API
      # without a token and failed on the runner's shared rate limit.
      - name: Download JetBrains Runtime 21.0.11
        if: matrix.jdk == 'jetbrains'
        shell: bash
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/jbrsdk.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-windows-x64-b1163.116.tar.gz"
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.jdk == 'jetbrains' && 'jdkfile' || matrix.jdk }}
          jdkFile: ${{ matrix.jdk == 'jetbrains' && format('{0}/jbrsdk.tar.gz', runner.temp) || '' }}
          java-version: "21"
      - name: Installer JDK is the JetBrains Runtime
        if: matrix.jdk == 'jetbrains'
        shell: bash
        run: java -XshowSettings:properties -version 2>&1 | grep -q 'java.vendor = JetBrains' || { echo "Expected the JetBrains Runtime for the Windows title bar" >&2; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: ./gradlew :app-desktop:${{ matrix.task }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chiller-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
