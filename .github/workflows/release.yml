# Push a tag like v1.2.0 (or v1.2.0-rc.1 for a release candidate) to build macOS and Windows installers and attach them
# to a GitHub Release. Installers get the numeric version (1.2.0); a suffixed tag is published as a pre-release.
# The release text is the tag's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    name: Release checks · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - name: Test tagged commit
        shell: bash
        run: ./gradlew check --stacktrace
      - name: Offline scenario
        if: runner.os != 'Windows'
        run: ./gradlew :evals:offlineSmoke

  installers:
    needs: verify
    name: Installer · ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            jdk: temurin
            output: app-desktop/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            # The JetBrains Runtime draws the custom title bar; the installer bundles the JDK it is built with.
            jdk: jetbrains
            output: app-desktop/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^([1-9][0-9]*\.[0-9]+\.[0-9]+)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1 with major > 0 (installer rule), got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.jdk }}
          java-version: "21"
      - name: Installer JDK is the JetBrains Runtime
        if: matrix.jdk == 'jetbrains'
        shell: bash
        run: java -XshowSettings:properties -version 2>&1 | grep -q 'java.vendor = JetBrains' || { echo "Expected the JetBrains Runtime for the Windows title bar" >&2; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: ./gradlew :app-desktop:${{ matrix.task }} -PchillerVersion=${{ steps.version.outputs.version }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  publish:
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section from "## [version]" up to the next "## [" heading, without the heading itself.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          name: Chiller ${{ github.ref_name }}
          body_path: notes.md
